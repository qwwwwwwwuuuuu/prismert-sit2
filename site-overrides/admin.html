<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>PUSHIN — Управление контрактом</title><style>*{box-sizing:border-box}body{margin:0;background:#fff8f1;color:#674a38;font:16px system-ui,sans-serif}main{max-width:540px;margin:8vh auto;padding:28px}a{color:inherit}h1{font-size:30px}form{display:grid;gap:16px;border:1px solid #dfc8b9;border-radius:24px;padding:26px;background:#fffdf9}label{display:grid;gap:8px;font-weight:600}input{width:100%;padding:13px;border:1px solid #cfb7a5;border-radius:12px;background:white;color:#503727;font:16px monospace}button{padding:14px;background:#f5b0c7;border:0;border-radius:24px;font:600 16px system-ui;color:#503727;cursor:pointer}button:disabled{opacity:.5}p{line-height:1.55}#current{overflow-wrap:anywhere}#status{min-height:48px;margin:0;font-size:14px}small{font-weight:400;line-height:1.5}</style><script src="/pushin-admin.js" defer></script></head><body><main><a href="/index.html">← PUSHIN</a><h1>Контракт на главной</h1><p>Текущее значение CA: <strong id="current">Загрузка…</strong></p><form id="contract-form"><label>Ключ администратора<input id="key" type="password" autocomplete="current-password" required></label><label>Контракт<input id="contract" type="text" placeholder="Вставьте контракт или test" maxlength="200" autocomplete="off" spellcheck="false" autocapitalize="off"><small>Пустое поле убирает адрес. Можно использовать test для проверки.</small></label><button type="submit">Применить</button><p id="status" role="status" aria-live="polite"></p></form><p>После сохранения открытые страницы получают обновление автоматически, обычно в течение 3 секунд при доступной сети.</p></main></body></html>
